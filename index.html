<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon-32x32.png"
      type="image/x-icon"
    />
    <title>Document</title>
  </head>
  <body class="placeholder">
    <div class="project-container">
      <div class="header">
        <div class="logo-container">
          <img
            id="logo"
            src="./assets/images/logo-dark-theme.svg"
            alt="dark-theme-logo"
          />
        </div>
        <div id="theme-toggle" class="dark-toggle">
          <img
            src="./assets/images/icon-sun.svg"
            alt=""
            id="theme-toggle-image"
          />
        </div>
      </div>
      <div class="title">
        <h1 class="text-preset-1">
          Analyze your text <br />
          in real-time.
        </h1>
      </div>
      <div class="text-input-container">
        <textarea name="" id="userInput" class="text-preset-3"> </textarea>
        <div class="text-input-info">
          <div class="text-input-options">
            <div class="checkbox-options">
              <div class="checkbox1">
                <input
                  type="checkbox"
                  id="exclude"
                  name="exclude"
                  value="exclude"
                />
                <label for="exclude" class="text-preset-4"
                  >Exclude Spaces</label
                >
              </div>

              <div class="checkbox2">
                <div class="checkbox2-checkbox">
                  <input
                    type="checkbox"
                    id="character-limit"
                    name="character-limit"
                    value="character-limit"
                  />
                  <label for="character-limit" class="text-preset-4"
                    >Set Character Limit</label
                  >
                </div>

                <div class="checkbox2-input text-preset-4">
                  <input
                    type="number"
                    id="character-limit-input"
                    minlength="1"
                    maxlength="3"
                    class="hide-me"
                  />
                </div>
              </div>
            </div>
          </div>

          <div class="reading-time">
            <p class="text-preset-4">
              Approx. reading time : <span id="time"> 1</span> minute(s)
            </p>
          </div>
        </div>
      </div>
      <div class="results">
        <div class="results-cards">
          <div class="box total-characters">
            <img src="/assets/images/pattern-character-count.svg" alt="" />
            <h2 class="text-preset-1" id="total-result">0</h2>
            <p class="text-preset-3">Total Characters</p>
          </div>
          <div class="box word-count">
            <img src="/assets/images/pattern-word-count.svg" alt="" />
            <h2 class="text-preset-1" id="word-result">0</h2>
            <p class="text-preset-3">Word Count</p>
          </div>
          <div class="box sentence-count">
            <img src="/assets/images/pattern-sentence-count.svg" alt="" />
            <h2 class="text-preset-1" id="sentence-result">0</h2>
            <p class="text-preset-3">Sentence Count</p>
          </div>
        </div>
        <div class="letter-density-container text-preset-4">
          <h2 class="text-preset-1-mobile">Letter Density</h2>
          <div class="bar-container bar-container-1">
            <p id="A">A</p>
            <div class="bar">
              <div class="bar-percent-A"></div>
            </div>
            <p class="percent-A">50%(16.55)</p>
          </div>
          <div class="bar-container bar-container-2">
            <p id="E">E</p>
            <div class="bar">
              <div class="bar-percent-E"></div>
            </div>
            <p class="percent-E">50%(16.55)</p>
          </div>
          <div class="bar-container bar-container-3">
            <p id="I">I</p>
            <div class="bar">
              <div class="bar-percent-I"></div>
            </div>
            <p class="percent-I">50%(16.55)</p>
          </div>
          <div class="bar-container bar-container-4">
            <p id="O">O</p>
            <div class="bar">
              <div class="bar-percent-O"></div>
            </div>
            <p class="percent-O">50%(16.55)</p>
          </div>
          <div class="bar-container bar-container-5">
            <p id="U">U</p>
            <div class="bar">
              <div class="bar-percent-U"></div>
            </div>
            <p class="percent-U">50%(16.55)</p>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
