<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="project-container">
      <div class="header">
        <div class="logo">
          <img src="/assets/images/logo-dark-theme.svg" alt="dark-theme-logo" />
        </div>
        <div class="theme-toggle">
          <img src="/assets/images/icon-sun.svg" alt="" />
        </div>
      </div>
      <div class="title">
        <h1 class="text-preset-1">
          Analyze your text <br />
          in real-time.
        </h1>
      </div>
      <div class="text-input-container">
        <textarea name="" id="" class="text-preset-3"></textarea>
        <div class="text-input-info">
          <div class="text-input-options"></div>
          <div id="input-reading-time">
            <small>Approximate Reading time</small>
          </div>
        </div>
      </div>
      <div class="results">
        <div class="results-cards"></div>
        <div class="letter-density-container"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
